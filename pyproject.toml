[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-control-intelligence"
version = "0.1.0rc2"
description = "Evidence-linked purchasing document control with local inference and explicit human review"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "pydantic==2.13.4",
  "pypdf==7.1.1",
  "pdfplumber==0.11.10",
  "pypdfium2==5.13.0",
  "Pillow==13.0.0",
  "reportlab==5.1.0",
  "scikit-learn==1.8.0",
  "httpx==0.28.1",
]

[project.scripts]
dci = "dci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dci = ["static/*", "migrations/*.sql"]

[dependency-groups]
browser = ["playwright==1.65.2"]
audit = ["pip-audit==2.10.1", "pip-licenses==5.5.5", "ruff==0.17.6"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
