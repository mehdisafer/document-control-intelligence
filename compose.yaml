name: dci-reference
services:
  api:
    image: dci:0.1.0rc1
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--config", "/etc/dci/config.json"]
    ports: ["127.0.0.1:8000:8000"]
    networks: [review]
    volumes:
      - data:/var/lib/dci
      - ${DCI_CONFIG_DIR:?Set DCI_CONFIG_DIR to the absolute provisioned configuration directory}:/etc/dci:ro
      - ${DCI_MODELS_DIR:?Set DCI_MODELS_DIR to an absolute model directory}:/models:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=134217728"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  worker:
    image: dci:0.1.0rc1
    command: ["worker", "--config", "/etc/dci/config.json"]
    network_mode: none
    volumes:
      - data:/var/lib/dci
      - ${DCI_CONFIG_DIR}:/etc/dci:ro
      - ${DCI_MODELS_DIR}:/models:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=268435456"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1200m
    cpus: 2
    pids_limit: 128
    init: true
    restart: unless-stopped
    stop_grace_period: 240s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  review:
    internal: true
volumes:
  data:
